name: Terminux validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n bin/termunix
      - name: Check required runtime and safety defaults
        run: |
          grep -q 'proot-distro install' install.sh
          grep -q 'opencode.ai/v2/install' install.sh
          grep -q '127.0.0.1' bin/termunix
          grep -q 'Terminux uninstall' README.md
          test -s skin/dist/gui-experimental.cjs
          test -s skin/themes/terminux-charcoal.json
      - name: Launcher has a single source of truth
        run: |
          # install.sh must install bin/termunix, never an inline copy.
          grep -q 'Terminux/bin/termunix' install.sh
          ! grep -q 'cat > "\$BIN_DIR/termunix"' install.sh
      - name: Keep-alive guarantees
        run: |
          grep -q 'TERMINUX_KEEPER' bin/termunix
          grep -q 'opencode service status' bin/termunix
          grep -q '90-terminux' install.sh
      - name: Check patch whitespace
        run: git diff --check
